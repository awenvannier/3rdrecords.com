name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow cairosvg
      - run: python build.py
        working-directory: 3rdrecords.com
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 3rdrecords.com/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://3rdrecords.com/
    steps:
      - uses: actions/deploy-pages@v4
